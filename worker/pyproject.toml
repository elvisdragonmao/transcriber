[project]
name = "transcriber-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Local GPU worker: Silero VAD, Qwen3-ASR, Qwen3-ForcedAligner, Nemotron-3-Diarization, TitaNet"
# Exact versions verified on emfox (RTX 5060 sm_120 + RTX 3050 sm_86, driver 595.99, CUDA 13.2).
# torch comes from https://download.pytorch.org/whl/cu132 (see deploy/install.sh).
dependencies = [
  "torch==2.13.0",
  "transformers==5.20.1",
  "accelerate",
  "nemo-toolkit[asr]==3.0.0",
  "Cython",
  "packaging",
  "onnxruntime",
  "silero-vad==6.2.3",
  "opencc-python-reimplemented==0.1.7",
  "soundfile",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
